name: ownCloud Redis Upgrade Smoke

on:
  pull_request:
    paths:
      - charts/owncloud/**
      - scripts/smoke-owncloud-redis.mjs
      - .github/workflows/owncloud-redis-smoke.yaml
  push:
    branches: [main]
    paths:
      - charts/owncloud/**
      - scripts/smoke-owncloud-redis.mjs
      - .github/workflows/owncloud-redis-smoke.yaml

permissions:
  contents: read

jobs:
  cache-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Test disposable Redis migrations with ownCloud PHPRedis
        run: node scripts/smoke-owncloud-redis.mjs
