name: Lint Charts

on:
  pull_request:
    paths:
      - charts/**
      - docs/**
      - scripts/build-catalog.mjs
      - scripts/prune-retired-charts.mjs
      - scripts/retired-charts.json
      - scripts/release-plan.mjs
      - scripts/package-charts.mjs
      - scripts/publish-oci.mjs
      - package.json
      - package-lock.json
      - README.md
      - .github/workflows/lint.yaml
      - .github/workflows/release.yaml
      - tests/*.test.mjs
  push:
    branches:
      - main
    paths:
      - charts/**
      - docs/**
      - scripts/build-catalog.mjs
      - scripts/prune-retired-charts.mjs
      - scripts/retired-charts.json
      - scripts/release-plan.mjs
      - scripts/package-charts.mjs
      - scripts/publish-oci.mjs
      - package.json
      - package-lock.json
      - README.md
      - .github/workflows/lint.yaml
      - .github/workflows/release.yaml
      - tests/*.test.mjs

jobs:
  lint:
    runs-on: helm-charts-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint charts
        run: helm lint charts/*
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install catalog tooling
        run: npm ci --ignore-scripts
      - name: Require chart version bumps
        env:
          CHART_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release-plan.mjs check-versions
      - name: Check generated catalog
        run: npm run check:catalog
      - name: Install signing test prerequisite
        shell: bash
        run: |
          if ! command -v gpg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gnupg
          fi
      - name: Verify chart rendering and catalog
        run: node --test tests/*.test.mjs
