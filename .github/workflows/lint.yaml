name: Lint Charts

on:
  pull_request:
    paths:
      - charts/**
      - docs/**
      - scripts/build-catalog.mjs
      - package.json
      - package-lock.json
      - README.md
      - .github/workflows/lint.yaml
      - tests/*.test.mjs
  push:
    branches:
      - main
    paths:
      - charts/**
      - docs/**
      - scripts/build-catalog.mjs
      - package.json
      - package-lock.json
      - README.md
      - .github/workflows/lint.yaml
      - tests/*.test.mjs

jobs:
  lint:
    runs-on: helm-charts-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint charts
        run: helm lint charts/*
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install catalog tooling
        run: npm ci --ignore-scripts
      - name: Check generated catalog
        run: npm run check:catalog
      - name: Verify chart rendering and catalog
        run: node --test tests/*.test.mjs
