name: Release Charts

on:
  workflow_dispatch:
    inputs:
      reconcile:
        description: Check all historical OCI versions and repair missing publications
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - charts/**
      - docs/**
      - scripts/build-catalog.mjs
      - scripts/prune-retired-charts.mjs
      - scripts/retired-charts.json
      - scripts/release-plan.mjs
      - scripts/package-charts.mjs
      - scripts/publish-oci.mjs
      - package.json
      - package-lock.json
      - README.md
      - .github/workflows/release.yaml

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  HELM_REPOSITORY_URL: https://charts.harish2k01.in

jobs:
  build-and-deploy:
    runs-on: helm-charts-runner
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Require chart version bumps
        env:
          CHART_BASE_SHA: ${{ github.event.before }}
        run: |
          npm ci --ignore-scripts
          node scripts/release-plan.mjs check-versions

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install GnuPG
        shell: bash
        run: |
          set -euo pipefail

          if command -v gpg >/dev/null 2>&1; then
            gpg --version
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y gnupg
          gpg --version

      - name: Import Helm signing key
        shell: bash
        env:
          HELM_GPG_PRIVATE_KEY_B64: ${{ secrets.HELM_GPG_PRIVATE_KEY_B64 }}
          HELM_GPG_KEY_NAME: ${{ secrets.HELM_GPG_KEY_NAME }}
          HELM_GPG_PASSPHRASE: ${{ secrets.HELM_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${HELM_GPG_PRIVATE_KEY_B64}" ]; then
            echo "HELM_GPG_PRIVATE_KEY_B64 secret is required to sign Helm charts." >&2
            exit 1
          fi

          if [ -z "${HELM_GPG_KEY_NAME}" ]; then
            echo "HELM_GPG_KEY_NAME secret is required to sign Helm charts." >&2
            exit 1
          fi

          export GNUPGHOME="${RUNNER_TEMP}/helm-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s' "$HELM_GPG_PRIVATE_KEY_B64" | base64 -d > "${RUNNER_TEMP}/helm-private-key.asc"
          gpg --batch --import "${RUNNER_TEMP}/helm-private-key.asc"

          printf '%s' "${HELM_GPG_PASSPHRASE}" > "${RUNNER_TEMP}/helm-gpg-passphrase"
          chmod 600 "${RUNNER_TEMP}/helm-gpg-passphrase"

          signing_key_uid="$(
            gpg --batch --with-colons --list-secret-keys "$HELM_GPG_KEY_NAME" |
              awk -F: '$1 == "uid" { print $10; exit }'
          )"

          if [ -z "$signing_key_uid" ]; then
            echo "Could not find a user ID for HELM_GPG_KEY_NAME. Check that it matches the imported private key." >&2
            gpg --batch --list-secret-keys --keyid-format LONG
            exit 1
          fi

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "${RUNNER_TEMP}/helm-gpg-passphrase" \
            --export-secret-keys "$HELM_GPG_KEY_NAME" > "${RUNNER_TEMP}/helm-secring.gpg"
          gpg --batch --yes --export "$HELM_GPG_KEY_NAME" > "${RUNNER_TEMP}/helm-pubring.gpg"
          gpg --batch --yes --armor --export "$HELM_GPG_KEY_NAME" > "${RUNNER_TEMP}/helm-chart-signing-key.asc"

          {
            echo "GNUPGHOME=${GNUPGHOME}"
            echo "HELM_SIGNING_KEY_NAME=${signing_key_uid}"
            echo "HELM_SIGNING_KEYRING=${RUNNER_TEMP}/helm-secring.gpg"
            echo "HELM_SIGNING_PUBLIC_KEYRING=${RUNNER_TEMP}/helm-pubring.gpg"
            echo "HELM_SIGNING_PASSPHRASE_FILE=${RUNNER_TEMP}/helm-gpg-passphrase"
            echo "HELM_SIGNING_PUBLIC_KEY=${RUNNER_TEMP}/helm-chart-signing-key.asc"
          } >> "$GITHUB_ENV"

      - name: Generate chart catalog
        run: |
          npm run build:catalog

      - name: Prepare Helm repository site
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="$HELM_REPOSITORY_URL"
          # Retry temporary HTTP errors without hiding persistent history-restore failures.
          CURL_OPTIONS=(-fsSL --retry 5 --retry-delay 2 --retry-max-time 120 --connect-timeout 15 --max-time 60)

          mkdir -p _site
          cp -R docs/. _site/
          touch _site/.nojekyll
          cp "$HELM_SIGNING_PUBLIC_KEY" _site/chart-signing-key.asc

          if index_status="$(curl "${CURL_OPTIONS[@]}" --write-out '%{http_code}' "$REPO_URL/index.yaml" -o _site/index.yaml)"; then
            node "$GITHUB_WORKSPACE/scripts/prune-retired-charts.mjs" _site
            restore_package() {
              local package_url="$1"
              local package_name provenance_name provenance_status
              package_name="$(basename "$package_url")"
              if [ ! -f "_site/$package_name" ]; then
                curl "${CURL_OPTIONS[@]}" "$package_url" -o "_site/$package_name"
              fi
              provenance_name="${package_name}.prov"
              if [ ! -f "_site/$provenance_name" ]; then
                if provenance_status="$(curl "${CURL_OPTIONS[@]}" --write-out '%{http_code}' "${package_url}.prov" -o "_site/$provenance_name")"; then
                  :
                elif [ "$provenance_status" = "404" ]; then
                  echo "No existing provenance file found for ${package_name}; it will be created if this chart version is still in charts/."
                  rm -f "_site/$provenance_name"
                else
                  echo "::error::Could not restore provenance for ${package_name} (HTTP ${provenance_status}); refusing to publish incomplete history."
                  return 1
                fi
              fi
            }

            # Four downloads at a time; wait for every worker and propagate any failure.
            pids=()
            failed=0
            while read -r package_url; do
              restore_package "$package_url" &
              pids+=("$!")
              if [ "${#pids[@]}" -eq 4 ]; then
                for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
                pids=()
                if [ "$failed" -ne 0 ]; then exit 1; fi
              fi
            done < <(grep -Eo 'https?://[^[:space:]]+\.tgz' _site/index.yaml | sort -u || true)
            for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
            if [ "$failed" -ne 0 ]; then exit 1; fi
          elif [ "$index_status" = "404" ]; then
            echo "No previous index found; preparing a new Helm repository."
            rm -f _site/index.yaml
          else
            echo "::error::Could not restore the existing index (HTTP ${index_status}); refusing to publish incomplete history."
            exit 1
          fi

      - name: Restore publication state
        shell: bash
        run: |
          set -euo pipefail
          if status="$(curl -fsSL --retry 5 --retry-delay 2 --retry-max-time 120 --connect-timeout 15 --max-time 60 --write-out '%{http_code}' "$HELM_REPOSITORY_URL/release-state.json" -o _site/release-state.json)"; then
            :
          elif [ "$status" = "404" ]; then
            rm -f _site/release-state.json
            echo "No publication state found; checking all existing OCI versions once."
          else
            echo "::error::Could not restore publication state (HTTP ${status}); refusing to continue."
            exit 1
          fi

      - name: Restore chart release assets
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { isRetiredAsset } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/prune-retired-charts.mjs`);

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            for (const release of releases) {
              if ((release.assets || []).length >= 30) {
                release.assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  per_page: 100,
                });
              }
            }
            fs.writeFileSync('.release-inventory.json', JSON.stringify(releases));

            for (const release of releases) {
              if (isRetiredAsset(`${release.tag_name}.tgz`)) continue;
              for (const asset of release.assets || []) {
                if (isRetiredAsset(asset.name)) continue;
                if (!asset.name.endsWith('.tgz') && !asset.name.endsWith('.tgz.prov')) {
                  continue;
                }

                const destination = path.join('_site', asset.name);
                if (fs.existsSync(destination)) {
                  continue;
                }

                core.info(`Restoring release asset ${asset.name} from ${release.tag_name}`);
                const response = await github.rest.repos.getReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                  headers: {
                    accept: 'application/octet-stream',
                  },
                });

                fs.writeFileSync(destination, Buffer.from(response.data));
              }
            }

      - name: Package and index Helm repository
        env:
          RECONCILE: ${{ inputs.reconcile || false }}
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="$HELM_REPOSITORY_URL"

          node scripts/release-plan.mjs
          node scripts/package-charts.mjs

          node "$GITHUB_WORKSPACE/scripts/prune-retired-charts.mjs" _site
          if [ -f _site/index.yaml ]; then
            cp _site/index.yaml _site/previous-index.yaml
            helm repo index _site --url "$REPO_URL" --merge _site/previous-index.yaml
            rm _site/previous-index.yaml
          else
            helm repo index _site --url "$REPO_URL"
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push pending OCI charts
        run: node scripts/publish-oci.mjs

      - name: Create GitHub releases
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const repoUrl = process.env.HELM_REPOSITORY_URL;
            const ociRepo = `oci://ghcr.io/${context.repo.owner.toLowerCase()}/${context.repo.repo.toLowerCase()}`;
            const inventory = JSON.parse(fs.readFileSync('.release-inventory.json', 'utf8'));
            const charts = JSON.parse(fs.readFileSync('.release-plan.json', 'utf8')).charts;

            async function uploadAssetIfMissing(releaseId, filePath, contentType) {
              const assetName = path.basename(filePath);
              const assets = inventory.find(release => release.id === releaseId)?.assets || [];

              if (assets.some((asset) => asset.name === assetName)) {
                core.info(`Release asset ${assetName} already exists; skipping.`);
                return;
              }

              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: assetName,
                data,
                headers: {
                  'content-type': contentType,
                  'content-length': data.length,
                },
              });
            }

            for (const { directory: chart, metadata } of charts) {
              const chartName = metadata.name;
              const chartVersion = String(metadata.version);
              const appVersion = metadata.appVersion || '';
              const description = metadata.description || '';
              const tag = `${chartName}-${chartVersion}`;
              const packagePath = path.join('_site', `${chartName}-${chartVersion}.tgz`);
              const provenancePath = `${packagePath}.prov`;

              if (!fs.existsSync(packagePath)) {
                core.info(`Package ${packagePath} was not found; skipping release ${tag}.`);
                continue;
              }

              const existing = inventory.find(release => release.tag_name === tag);
              let release = existing ? { data: existing } : undefined;
              if (existing?.assets?.some(asset => asset.name === path.basename(packagePath)) &&
                  existing.assets.some(asset => asset.name === path.basename(provenancePath))) {
                core.info(`Release ${tag} is complete; skipping.`);
                continue;
              }

              const notes = [
                `## ${chartName} ${chartVersion}`,
                '',
                description,
                '',
                '### Versions',
                '',
                `- Chart version: \`${chartVersion}\``,
                `- App version: \`${appVersion}\``,
                '',
                '### Install',
                '',
                '```bash',
                `helm repo add harish2k01 ${repoUrl}`,
                'helm repo update',
                `helm install ${chartName} harish2k01/${chartName} --version ${chartVersion}`,
                '```',
                '',
                '### Install from OCI',
                '',
                '```bash',
                `helm install ${chartName} ${ociRepo}/${chartName} --version ${chartVersion}`,
                '```',
                '',
                '### Upgrade',
                '',
                '```bash',
                `helm upgrade ${chartName} harish2k01/${chartName} --version ${chartVersion}`,
                '```',
                '',
                '### Links',
                '',
                `- Helm repository: ${repoUrl}`,
                `- OCI chart: \`${ociRepo}/${chartName}:${chartVersion}\``,
                `- Chart source: https://github.com/${context.repo.owner}/${context.repo.repo}/tree/main/${chart}`,
                `- Package: ${repoUrl}/${chartName}-${chartVersion}.tgz`,
                '',
              ].join('\n');

              if (!release) {
                release = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `${chartName} ${chartVersion}`,
                  body: notes,
                });
                inventory.push({ ...release.data, assets: [] });
              }

              await uploadAssetIfMissing(release.data.id, packagePath, 'application/gzip');

              if (fs.existsSync(provenancePath)) {
                await uploadAssetIfMissing(release.data.id, provenancePath, 'application/pgp-signature');
              } else {
                core.warning(`Provenance file ${provenancePath} was not found; release ${tag} will not have a signature asset.`);
              }
            }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
