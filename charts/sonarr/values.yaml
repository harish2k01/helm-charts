replicaCount: 1

# Container image. The default tag is pinned instead of using latest so chart
# installs are repeatable.
image:
  repository: lscr.io/linuxserver/sonarr
  tag: "4.0.20"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# LinuxServer.io images use PUID/PGID to choose the user that owns app files.
# Match these to the permissions on your config and media volumes.
# New server settings are opt-in: list your external/service DNS names and only
# the ingress proxy CIDRs you control. Do not trust every address.
# SONARR__SERVER__ALLOWEDHOSTS: "sonarr.example.com,sonarr,sonarr.default.svc.cluster.local"
# SONARR__SERVER__TRUSTEDNETWORKS: "192.0.2.0/24"
env:
  PUID: "3000"
  PGID: "3000"
  TZ: Asia/Kolkata

# Load credentials from existing Secrets or shared ConfigMaps. Explicit env wins.

  # Optional runtime configuration. Every item below is commented and has no chart
  # default. Leave unset to retain the app/config-file setting. Values are strings.
  # Full purpose, upstream defaults, precedence and sources: CONFIGURATION.md.
  # Mask applied to newly created files Upstream default: 022.
  # UMASK: "022"
  # App identity and UI: InstanceName Upstream default: Sonarr.
  # SONARR__APP__INSTANCENAME: "Sonarr"
  # App identity and UI: Theme Upstream default: auto.
  # SONARR__APP__THEME: "auto"
  # App identity and UI: LaunchBrowser Upstream default: true.
  # SONARR__APP__LAUNCHBROWSER: "true"
  # Authentication: ApiKey Upstream default: generated/persisted.
  # Secret value: supply using envFrom or a mounted Secret, not plaintext values.
  # SONARR__AUTH__APIKEY: ""
  # Authentication: Enabled Upstream default: false.
  # SONARR__AUTH__ENABLED: "false"
  # Authentication: Method Upstream default: None (first-run setup required).
  # SONARR__AUTH__METHOD: "Forms"
  # Authentication: Required Upstream default: Enabled.
  # SONARR__AUTH__REQUIRED: "Enabled"
  # Authentication: TrustCgnatIpAddresses Upstream default: false.
  # SONARR__AUTH__TRUSTCGNATIPADDRESSES: "false"
  # Logging: Level Upstream default: debug.
  # SONARR__LOG__LEVEL: "debug"
  # Logging: FilterSentryEvents Upstream default: true.
  # SONARR__LOG__FILTERSENTRYEVENTS: "true"
  # Logging: Rotate Upstream default: 50.
  # SONARR__LOG__ROTATE: "50"
  # Logging: SizeLimit Upstream default: 1.
  # SONARR__LOG__SIZELIMIT: "1"
  # Logging: Sql Upstream default: false.
  # SONARR__LOG__SQL: "false"
  # Logging: ConsoleLevel Upstream default: empty.
  # SONARR__LOG__CONSOLELEVEL: ""
  # Logging: ConsoleFormat Upstream default: Standard.
  # SONARR__LOG__CONSOLEFORMAT: "Standard"
  # Logging: AnalyticsEnabled Upstream default: true.
  # SONARR__LOG__ANALYTICSENABLED: "true"
  # Logging: SyslogServer Upstream default: empty.
  # SONARR__LOG__SYSLOGSERVER: ""
  # Logging: SyslogPort Upstream default: 514.
  # SONARR__LOG__SYSLOGPORT: "514"
  # Logging: SyslogLevel Upstream default: inherits Log.Level.
  # SONARR__LOG__SYSLOGLEVEL: ""
  # Logging: DbEnabled Upstream default: true.
  # SONARR__LOG__DBENABLED: "true"
  # External PostgreSQL: Host Upstream default: empty (SQLite).
  # SONARR__POSTGRES__HOST: "postgresql.database.svc"
  # External PostgreSQL: Port Upstream default: 5432.
  # SONARR__POSTGRES__PORT: "5432"
  # External PostgreSQL: User Upstream default: empty.
  # SONARR__POSTGRES__USER: ""
  # External PostgreSQL: Password Upstream default: empty.
  # Secret value: supply using envFrom or a mounted Secret, not plaintext values.
  # SONARR__POSTGRES__PASSWORD: ""
  # External PostgreSQL: MainDb Upstream default: sonarr-main.
  # SONARR__POSTGRES__MAINDB: "sonarr-main"
  # External PostgreSQL: LogDb Upstream default: sonarr-log.
  # SONARR__POSTGRES__LOGDB: "sonarr-log"
  # Listener/proxy/TLS: UrlBase Upstream default: empty.
  # SONARR__SERVER__URLBASE: ""
  # Listener/proxy/TLS: BindAddress Upstream default: *.
  # SONARR__SERVER__BINDADDRESS: "*"
  # Listener/proxy/TLS: AllowedHosts Upstream default: empty (any host).
  # SONARR__SERVER__ALLOWEDHOSTS: "sonarr.example.com"
  # Listener/proxy/TLS: Port Upstream default: 8989.
  # SONARR__SERVER__PORT: "8989"
  # Listener/proxy/TLS: EnableSsl Upstream default: false.
  # SONARR__SERVER__ENABLESSL: "false"
  # Listener/proxy/TLS: SslPort Upstream default: 9898.
  # SONARR__SERVER__SSLPORT: "9898"
  # Listener/proxy/TLS: SslCertPath Upstream default: empty.
  # SONARR__SERVER__SSLCERTPATH: ""
  # Listener/proxy/TLS: SslCertPassword Upstream default: empty.
  # Secret value: supply using envFrom or a mounted Secret, not plaintext values.
  # SONARR__SERVER__SSLCERTPASSWORD: ""
  # Listener/proxy/TLS: TrustedNetworks Upstream default: empty (loopback only).
  # SONARR__SERVER__TRUSTEDNETWORKS: "192.0.2.0/24"
  # Binary updater (keep image-managed): Mechanism Upstream default: BuiltIn.
  # SONARR__UPDATE__MECHANISM: "BuiltIn"
  # Binary updater (keep image-managed): Automatically Upstream default: false on Linux.
  # SONARR__UPDATE__AUTOMATICALLY: "false"
  # Binary updater (keep image-managed): ScriptPath Upstream default: empty.
  # SONARR__UPDATE__SCRIPTPATH: ""
  # Binary updater (keep image-managed): Branch Upstream default: main.
  # SONARR__UPDATE__BRANCH: "main"

  # Optional LinuxServer image extensions; use trusted mods only (executes code).
  # DOCKER_MODS: ""

envFrom: []

# Main HTTP service for the Sonarr web UI/API.
service:
  type: ClusterIP
  port: 8989
  targetPort: 8989
  portName: http
  extraPorts: []

extraContainerPorts: []

# Persistent application configuration. This should be separate from media
# storage because Sonarr writes its database and settings here.
persistence:
  config:
    enabled: true
    mountPath: /config
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: ""

# Optional existing media PVC. To preserve hardlinks and atomic moves, mount the
# same PVC at the same path as qBittorrent and the other media automation apps.
media:
  enabled: false
  existingClaim: ""
  mountPath: /vault
  readOnly: false
  mounts: []

# Sonarr usually does not need host devices, but the generic chart supports them
# for advanced use cases.
hostDevices:
  enabled: false
  devices: []

# Advanced volume hooks for custom mounts that are not covered above.
extraVolumes: []
extraVolumeMounts: []

# Optional Kubernetes Ingress for exposing the web UI/API.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Optional Gateway API HTTPRoute for exposing the web UI/API.
# Gateway API routing. Requires Gateway API CRDs and a compatible controller.
# Map keys (main, internal, external, etc.) are names you choose, not access policies.
# Every enabled entry creates one HTTPRoute named <app-fullname>-<key>.
httpRoutes:
  main:
    # Keep disabled until you provide Gateway references and application hostnames.
    # Additional entries default to enabled when their enabled field is omitted.
    enabled: false
    # Per-route metadata, for example controller-specific annotations.
    annotations: {}
    # Attach this route to one or more Gateways/listeners. The Gateway must allow
    # routes from this app's namespace. Omit namespace for a same-namespace Gateway;
    # omit sectionName to target compatible listeners on that Gateway.
    parentRefs: []
    #  - name: internal-gateway
    #    namespace: ingress
    #    sectionName: https
    #  - name: second-internal-gateway
    #    namespace: ingress
    #    sectionName: https
    # Requests can match ANY hostname below, on ANY compatible parent above.
    # These lists do not pair hostnames with individual Gateways by position.
    hostnames: []
    #  - app.internal.example.com
    #  - app-alias.internal.example.com
    # Match request paths/headers/methods and optionally apply Gateway API filters.
    # Rules default to PathPrefix / when omitted. Backend references are generated
    # from this chart's application Service and HTTP port, not supplied here.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # filters:
        #   - type: RequestHeaderModifier
        #     requestHeaderModifier:
        #       set:
        #         - name: X-Route
        #           value: internal
  # Use a separate entry when public hostnames should attach to another Gateway.
  # external:
  #   enabled: true
  #   annotations: {}
  #   parentRefs:
  #     - name: external-gateway
  #       namespace: ingress
  #       sectionName: https
  #   hostnames:
  #     - app.example.com
  #     - app-alias.example.com
  #   rules:
  #     - matches:
  #         - path:
  #             type: PathPrefix
  #             value: /

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
    # Upstream always permits loopback hostnames, even with AllowedHosts set.
    httpHeaders:
      - name: Host
        value: localhost
  initialDelaySeconds: 45
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
    # Upstream always permits loopback hostnames, even with AllowedHosts set.
    httpHeaders:
      - name: Host
        value: localhost
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
