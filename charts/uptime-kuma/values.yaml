replicaCount: 1

image:
  repository: louislam/uptime-kuma
  pullPolicy: IfNotPresent
  tag: "2.5.6-slim"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3001
  # Match UPTIME_KUMA_PORT when overriding the application listener.
  targetPort: 3001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Gateway API routing. Requires Gateway API CRDs and a compatible controller.
# Map keys (main, internal, external, etc.) are names you choose, not access policies.
# Every enabled entry creates one HTTPRoute named <app-fullname>-<key>.
httpRoutes:
  main:
    # Keep disabled until you provide Gateway references and application hostnames.
    # Additional entries default to enabled when their enabled field is omitted.
    enabled: false
    # Per-route metadata, for example controller-specific annotations.
    annotations: {}
    # Attach this route to one or more Gateways/listeners. The Gateway must allow
    # routes from this app's namespace. Omit namespace for a same-namespace Gateway;
    # omit sectionName to target compatible listeners on that Gateway.
    parentRefs: []
    #  - name: internal-gateway
    #    namespace: ingress
    #    sectionName: https
    #  - name: second-internal-gateway
    #    namespace: ingress
    #    sectionName: https
    # Requests can match ANY hostname below, on ANY compatible parent above.
    # These lists do not pair hostnames with individual Gateways by position.
    hostnames: []
    #  - app.internal.example.com
    #  - app-alias.internal.example.com
    # Match request paths/headers/methods and optionally apply Gateway API filters.
    # Rules default to PathPrefix / when omitted. Backend references are generated
    # from this chart's application Service and HTTP port, not supplied here.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # filters:
        #   - type: RequestHeaderModifier
        #     requestHeaderModifier:
        #       set:
        #         - name: X-Route
        #           value: internal
  # Use a separate entry when public hostnames should attach to another Gateway.
  # external:
  #   enabled: true
  #   annotations: {}
  #   parentRefs:
  #     - name: external-gateway
  #       namespace: ingress
  #       sectionName: https
  #   hostnames:
  #     - app.example.com
  #     - app-alias.example.com
  #   rules:
  #     - matches:
  #         - path:
  #             type: PathPrefix
  #             value: /

# Database configuration.
# Uptime Kuma uses SQLite by default. Enable either mariadb or external to use MariaDB.
database:
  mariadb:
    enabled: false
    image:
      repository: mariadb
      pullPolicy: IfNotPresent
      tag: "11"
    service:
      port: 3306
    auth:
      database: uptime_kuma
      username: uptime_kuma
      # Password can be supplied directly for local testing. Prefer existingSecret for production.
      password: ""
      # Optional root password. Leave empty to let MariaDB generate a random root password.
      rootPassword: ""
      # Existing secret must contain passwordKey. rootPasswordKey is only used when rootPassword is set.
      existingSecret: ""
      passwordKey: db-password
      rootPasswordKey: db-root-password
    persistence:
      enabled: true
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      # Immutable claim labels: pin the current template labels for existing installs.
      # Keep historical version labels fixed; new installs use stable defaults.
      claimTemplateLabels: {}
      existingClaim: ""
    resources: {}
    nodeSelector: {}
    podSecurityContext: {}
    healthcheck:
      enabled: true
      interval: 5s
      retries: 3
      timeout: 5s

  external:
    enabled: false
    # Uptime Kuma only supports sqlite or mariadb
    type: "mariadb"
    host: ""
    port: "3306"
    database: "uptime_kuma"
    username: ""
    # Password can be supplied directly for local testing. Prefer existingSecret for production.
    password: ""
    # Existing secret must contain passwordKey.
    existingSecret: ""
    passwordKey: db-password

persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  existingClaim: ""

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Additional environment variables (Non-secret)
# These override the defaults. See https://github.com/louislam/uptime-kuma/wiki/Environment-Variables
env: {}
# Optional runtime overrides; copy the needed entries inside env.
# Keep these commented to inherit upstream defaults and persisted settings.
#   UPTIME_KUMA_SQLITE_SINGLE_CONNECTION: "true"
#   UPTIME_KUMA_DB_POOL_MAX_CONNECTIONS: "10"
#   UPTIME_KUMA_DB_SOCKET: "/run/mysqld/mysqld.sock"
#   UPTIME_KUMA_HOST: "0.0.0.0"
#   UPTIME_KUMA_PORT: "3001" # Match service.targetPort.
#   UPTIME_KUMA_SSL_CERT: "/tls/tls.crt" # Mount with extraVolumes.
#   UPTIME_KUMA_SSL_KEY: "/tls/tls.key"
#   UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN: "true" # Allows embedding.
#   UPTIME_KUMA_WS_ORIGIN_CHECK: "bypass" # Weakens WebSocket origin checks.
#   UPTIME_KUMA_LOG_RESPONSE_BODY_MONITOR_ID: "1" # Sensitive debug output.
#   TZ: "Etc/UTC"
#   SQL_LOG: "1" # SQL logging may contain private data.
#   DEBUG: "socket"
#   TIMELOGGER: "1"
# DATA_DIR is fixed at /app/data by the image/persistent mount; changing it
# needs a matching extraVolumeMount. Embedded MariaDB is deliberately not
# enabled; use database.mariadb for the chart-managed database.
# Browser-monitor controls such as UPTIME_KUMA_ALLOW_ALL_CHROME_EXEC apply to
# full/browser-capable images, not this chart's slim default.
# UPTIME_KUMA_DEBUG_INSPECTOR is a diagnostic switch, not a service port to expose.

# Additional environment values with valueFrom references to existing Secrets.
extraEnv: []
# - name: UPTIME_KUMA_SSL_KEY_PASSPHRASE
#   valueFrom:
#     secretKeyRef:
#       name: kuma-tls
#       key: passphrase
# The same pattern supports NOTIFICATION_PROXY or UPTIME_KUMA_CLOUDFLARED_TOKEN.

# Whole Secret/ConfigMap environment sources (chart-managed DB env wins).
envFrom: []

# Mount custom CA/TLS files or database sockets without embedding them in values.
extraVolumes: []
extraVolumeMounts: []
  # === Server Settings ===
  # UPTIME_KUMA_HOST: "0.0.0.0"  # Host to listen on
  # UPTIME_KUMA_PORT: "3001"     # Port to listen on (overrides standard port)
  
  # === Security & Proxy ===
  # UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN: "false"  # Set true to allow embedding in iframes
  # UPTIME_KUMA_WS_ORIGIN_CHECK: "cors-like"       # Check WS origin: bypass or cors-like
  # UPTIME_KUMA_ALLOW_ALL_CHROME_EXEC: "0"         # Allow executing Chrome with all permissions
  # NOTIFICATION_PROXY: "http://proxy:8080"        # Proxy for notifications (http, https, socks)
  # UPTIME_KUMA_CLOUDFLARED_TOKEN: ""              # Cloudflare tunnel token
  
  # === TLS / SSL ===
  # NODE_EXTRA_CA_CERTS: "/path/to/cert.pem"       # Extra CA certificates
  # NODE_TLS_REJECT_UNAUTHORIZED: "1"              # Set 0 to ignore unauthorized certs (not recommended)
  # NODE_OPTIONS: "--insecure-http-parser"         # Advanced Node.js options
  # UPTIME_KUMA_SSL_KEY: ""                        # Path to SSL Key
  # UPTIME_KUMA_SSL_CERT: ""                       # Path to SSL Cert
  # UPTIME_KUMA_SSL_KEY_PASSPHRASE: ""             # Passphrase for SSL Key
  
  # === Database ===
  # (Note: Database env vars are auto-configured if database.mariadb or database.external is enabled)
  # UPTIME_KUMA_SQLITE_SINGLE_CONNECTION: "false"  # Fix for "SQLITE_BUSY: database is locked"
  # UPTIME_KUMA_DB_TYPE: "sqlite"                  # sqlite or mariadb
  # UPTIME_KUMA_DB_HOSTNAME: "localhost"           # DB Host
  # UPTIME_KUMA_DB_PORT: "3306"                    # DB Port
  # UPTIME_KUMA_DB_SOCKET: ""                      # DB Socket
  # UPTIME_KUMA_DB_POOL_MAX_CONNECTIONS: "10"      # Max DB connections
  # UPTIME_KUMA_DB_NAME: "uptime_kuma"             # DB Name
  # UPTIME_KUMA_DB_USERNAME: "uptime_kuma"         # DB Username
  # UPTIME_KUMA_DB_SSL: "false"                    # Enable SSL for DB
  # UPTIME_KUMA_DB_CA: ""                          # Path to DB CA Cert
