# Run one replica by default. Keep this at 1 when using the bundled PostgreSQL
# database; increase only when Umami and your database setup are ready for it.
replicaCount: 1

image:
  # Official Umami container image published by the upstream project.
  repository: ghcr.io/umami-software/umami
  pullPolicy: IfNotPresent
  # Pin this to a concrete version for repeatable installs and safer upgrades.
  tag: "3.4.0"

# Set when pulling images from a private registry or mirror.
imagePullSecrets: []

# Override generated resource names when embedding this chart in larger releases.
nameOverride: ""
fullnameOverride: ""

# Add annotations or labels consumed by policy engines, reloaders, or operators.
podAnnotations: {}
podLabels: {}

# Pod and container security context knobs are left empty so clusters can apply
# their own defaults through admission policies.
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# Umami v3 requires PostgreSQL. Use the bundled PostgreSQL for simple installs,
# or disable it and enable database.external for a managed database service.
database:
  postgresql:
    enabled: true
    image:
      repository: postgres
      pullPolicy: IfNotPresent
      tag: "17-alpine"
    service:
      port: 5432
    auth:
      database: umami
      username: umami
      # Default is for quick evaluation. Use existingSecret or override this for production.
      password: "umami"
      # Existing secret must contain passwordKey.
      existingSecret: ""
      passwordKey: db-password
    persistence:
      enabled: true
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 8Gi
      existingClaim: ""
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podSecurityContext: {}
    healthcheck:
      enabled: true
      interval: 10s
      retries: 5
      timeout: 5s

  external:
    enabled: false
    # Full PostgreSQL connection URL. Prefer existingSecret for production.
    url: ""
    # Existing secret must contain databaseUrlKey.
    existingSecret: ""
    databaseUrlKey: DATABASE_URL

umami:
  # Use an existing Secret for APP_SECRET in production. The secret must contain appSecretKey.
  secrets:
    existingSecret: ""
    appSecretKey: APP_SECRET
    # Change rolloutToken when externally managed secrets change and pods should restart.
    rolloutToken: "1"
    inline:
      # Replace this before exposing Umami. Generate with: openssl rand -hex 32
      APP_SECRET: "replace-me-with-a-random-string"

  # Non-secret Umami runtime environment variables. DATABASE_URL and APP_SECRET
  # are managed by the chart from database and secret settings.
  env:
    PORT: "3000"
    DISABLE_TELEMETRY: "1"
    # Optional runtime settings; uncomment only the behavior you want to change.
    # MCP_ENABLED: "1" # Enables the API-key-authenticated /mcp endpoint.
    # DISABLE_LOGIN: "1" # Disables account sign-in.
    # DISABLE_UI: "1" # Collector-only deployment.
    # DISABLE_UPDATES: "1" # Hide upstream update checks.
    # DISABLE_BOT_CHECK: "1" # Include detected bots in collected events.
    # CLIENT_IP_HEADER: "X-Forwarded-For" # Trust only headers set by your proxy.
    # IGNORE_IP: "127.0.0.1" # Comma-separated addresses excluded from tracking.
    # REMOVE_TRAILING_SLASH: "1"
    # CORS_MAX_AGE: "86400"
    # ALLOWED_FRAME_URLS: "https://dashboard.example.com"
    # PRIVATE_MODE: "1" # Hide telemetry and related public UI metadata.
    # SKIP_LOCATION_HEADERS: "1" # Disable hosting-provider location headers.
    # SALT_ROTATION: "month"
    # USE_UUIDV7: "1"
    # LOG_QUERY: "1" # SQL logging may expose analytics data.
    # GEOLITE_DB_PATH: "/geo/GeoLite2-City.mmdb" # Mount with extraVolumes.
    # FAVICON_URL: "https://icons.example.com/{{domain}}"
    # LINKS_URL: "https://links.example.com"
    # PIXELS_URL: "https://pixels.example.com"
    # COLLECT_API_ENDPOINT: "https://collector.example.com/api/send"
    # KAFKA_BROKER: "kafka.example.com:9093" # Requires Secret-backed KAFKA_URL.
    # KAFKA_SASL_MECHANISM: scram-sha-512
    # KAFKA_MAX_MESSAGE_BYTES: "1048576"
    # KAFKA_SSL_ALLOW_UNAUTHORIZED: "false" # Keep TLS verification enabled.
    # SKIP_DB_CHECK: "1" # Advanced: do not skip database checks during upgrades.
    # SKIP_DB_MIGRATION: "1" # Only if migrations are managed separately.

  # Kubernetes EnvVar entries, especially Secret references for sensitive keys.
  # Use this for TWO_FACTOR_ENCRYPTION_KEY, REDIS_URL, CLICKHOUSE_URL,
  # DATABASE_REPLICA_URL, DIRECT_DATABASE_URL, KAFKA_URL or MAXMIND_LICENSE_KEY.
  # DATABASE_URL and APP_SECRET stay managed by database/secrets settings above.
  extraEnv: []
  # - name: TWO_FACTOR_ENCRYPTION_KEY
  #   valueFrom:
  #     secretKeyRef:
  #       name: umami-2fa
  #       key: encryption-key

  # Additional envFrom entries for ConfigMaps or Secrets managed outside the chart.
  envFrom: []

  # Extra volumes are useful for mounting custom CA bundles or geo databases.
  extraVolumes: []
  extraVolumeMounts: []

  resources: {}

startupProbe:
  httpGet:
    path: /api/heartbeat
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 120

livenessProbe:
  httpGet:
    path: /api/heartbeat
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/heartbeat
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
