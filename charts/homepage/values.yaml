replicaCount: 1

# Container image. Pin this tag for repeatable installs and predictable
# upgrades instead of following latest.
image:
  repository: ghcr.io/gethomepage/homepage
  tag: "v2.8.0"
  pullPolicy: IfNotPresent

# Use image pull secrets when the image is mirrored into a private registry.
imagePullSecrets: []

# Override generated resource names when integrating with existing naming
# conventions or migrations.
nameOverride: ""
fullnameOverride: ""

# Extra annotations and labels for the Homepage pod, commonly used by policy,
# backup, or reload controllers.
podAnnotations: {}
podLabels: {}

podSecurityContext: {}

# Homepage supports non-root execution through PUID/PGID. Keep this aligned
# with the mounted config volume ownership.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# ServiceAccount/RBAC are needed when kubernetes.yaml uses mode: cluster or
# when using Kubernetes service discovery/widgets.
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: true
  gatewayApi: true
  traefik: true
  metrics: true

# Additional non-secret environment variables. HOMEPAGE_ALLOWED_HOSTS is
# rendered from homepage.allowedHosts so the pod IP needed by probes is always
# included.
env:
  TZ: Asia/Kolkata
  PUID: "1000"
  PGID: "1000"
  # Optional runtime settings; leave commented to inherit upstream behavior.
  # LOG_LEVEL: info
  # LOG_TARGETS: stdout # both, stdout, or file.
  # HOMEPAGE_PROXY_DISABLE_IPV6: "true" # Force IPv4 for widget proxy requests.
  # HOMEPAGE_CONFIG_DIR: /app/config # Match the mounted configuration directory.
  # HOMEPAGE_VAR_EXAMPLE: "value" # Substitutes {{HOMEPAGE_VAR_EXAMPLE}} in YAML.
  # HOMEPAGE_FILE_EXAMPLE: /secrets/example # File contents substituted into YAML.
  # PORT: "3000" # Match service.targetPort when changing the listener.
  # HOSTNAME: "::" # Image falls back to IPv4 if dual-stack binding fails.
  # Optional v2 authentication (disabled upstream unless explicitly true).
  # HOMEPAGE_AUTH_ENABLED: "true"
  # HOMEPAGE_EXTERNAL_URL: https://dashboard.example.com # Required for auth.
  # HOMEPAGE_OIDC_ISSUER: https://id.example.com # Select OIDC instead of password.
  # HOMEPAGE_OIDC_CLIENT_ID: homepage
  # HOMEPAGE_OIDC_NAME: Homepage OIDC
  # HOMEPAGE_OIDC_SCOPE: openid email profile
  # HOMEPAGE_OIDC_AUTO_LOGIN: "true" # Skip the sign-in page for OIDC.
  # Optional MCP config API (disabled upstream unless explicitly true).
  # HOMEPAGE_MCP_ENABLED: "true"
  # HOMEPAGE_MCP_ALLOW_WRITE: "false" # Requires writable operator-owned config.
  # HOMEPAGE_AUTH_SECRET, HOMEPAGE_AUTH_PASSWORD, HOMEPAGE_OIDC_CLIENT_SECRET
  # and HOMEPAGE_MCP_TOKEN belong in extraEnv Secret references or envFrom.
  # Authentication secret and MCP token must each be at least 32 characters.
  # NEXTAUTH_URL / NEXTAUTH_SECRET are supported upstream aliases; use only one
  # naming family to avoid an alias taking precedence unexpectedly.
  # Next.js BUILD_/NEXT_PUBLIC_* values are image-build metadata, not pod options.

# Individual Kubernetes EnvVar entries, including references to existing Secrets.
# Secret contents stay out of ConfigMaps and plaintext Deployment environment.
extraEnv: []
# - name: HOMEPAGE_AUTH_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: homepage-auth
#       key: cookie-secret
# - name: HOMEPAGE_AUTH_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: homepage-auth
#       key: password

# Secret or ConfigMap references for sensitive HOMEPAGE_VAR_ or HOMEPAGE_FILE_
# values used inside Homepage config files.
envFrom: []

homepage:
  # Add public hostnames here, for example homepage.example.com. The chart
  # always includes the pod address at service.targetPort for health probes.
  allowedHosts: []

  # Use an existing ConfigMap with Homepage config files instead of generating
  # one from config.files.
  existingConfigMap: ""

  # Files are mounted into /app/config. Values can be replaced entirely from
  # your own values file.
  config:
    enabled: true
    files:
      kubernetes.yaml: |
        mode: cluster
        ingress: true
        gateway: true
      settings.yaml: |
        title: Homepage
      bookmarks.yaml: |
        - Developer:
            - GitHub:
                - abbr: GH
                  href: https://github.com/
      services.yaml: |
        - Cluster:
            - Kubernetes:
                href: https://kubernetes.io/
                description: Kubernetes documentation
      widgets.yaml: |
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: cluster
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - search:
            provider: duckduckgo
            target: _blank
      docker.yaml: ""
      custom.css: ""
      custom.js: ""

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  portName: http
  annotations: {}
  extraPorts: []

extraContainerPorts: []

# Optional config PVC. Leave disabled to run from generated ConfigMap files.
# For MCP writes, also set homepage.config.enabled=false so read-only ConfigMap
# files do not shadow this writable volume. Pre-populate the PVC yourself; the
# chart does not overwrite or seed an existing config directory. Logs use emptyDir.
persistence:
  config:
    enabled: false
    mountPath: /app/config
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClassName: ""

# Advanced volume hooks for custom files such as proxmox.yaml or provider
# secrets mounted with HOMEPAGE_FILE_ variables.
extraVolumes: []
extraVolumeMounts: []

# Optional Kubernetes Ingress. Set homepage.allowedHosts to the same hostnames.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Optional Gateway API HTTPRoute. Set homepage.allowedHosts to the same
# hostnames.
# Gateway API routing. Requires Gateway API CRDs and a compatible controller.
# Map keys (main, internal, external, etc.) are names you choose, not access policies.
# Every enabled entry creates one HTTPRoute named <app-fullname>-<key>.
httpRoutes:
  main:
    # Keep disabled until you provide Gateway references and application hostnames.
    # Additional entries default to enabled when their enabled field is omitted.
    enabled: false
    # Per-route metadata, for example controller-specific annotations.
    annotations: {}
    # Attach this route to one or more Gateways/listeners. The Gateway must allow
    # routes from this app's namespace. Omit namespace for a same-namespace Gateway;
    # omit sectionName to target compatible listeners on that Gateway.
    parentRefs: []
    #  - name: internal-gateway
    #    namespace: ingress
    #    sectionName: https
    #  - name: second-internal-gateway
    #    namespace: ingress
    #    sectionName: https
    # Requests can match ANY hostname below, on ANY compatible parent above.
    # These lists do not pair hostnames with individual Gateways by position.
    hostnames: []
    #  - app.internal.example.com
    #  - app-alias.internal.example.com
    # Match request paths/headers/methods and optionally apply Gateway API filters.
    # Rules default to PathPrefix / when omitted. Backend references are generated
    # from this chart's application Service and HTTP port, not supplied here.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # filters:
        #   - type: RequestHeaderModifier
        #     requestHeaderModifier:
        #       set:
        #         - name: X-Route
        #           value: internal
  # Use a separate entry when public hostnames should attach to another Gateway.
  # external:
  #   enabled: true
  #   annotations: {}
  #   parentRefs:
  #     - name: external-gateway
  #       namespace: ingress
  #       sectionName: https
  #   hostnames:
  #     - app.example.com
  #     - app-alias.example.com
  #   rules:
  #     - matches:
  #         - path:
  #             type: PathPrefix
  #             value: /

resources: {}

livenessProbe:
  httpGet:
    path: /api/healthcheck
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/healthcheck
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
