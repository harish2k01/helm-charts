replicaCount: 1

# Container image. The default tag is pinned instead of using latest so chart
# installs are repeatable.
image:
  repository: vaultwarden/server
  tag: "1.37.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Non-secret Vaultwarden configuration.
env:
  TZ: Asia/Kolkata
  DOMAIN: ""
  SIGNUPS_ALLOWED: "false"
  SMTP_HOST: ""
  SMTP_FROM: ""
  SMTP_FROM_NAME: Vaultwarden
  SMTP_USERNAME: ""
  SMTP_SECURITY: starttls
  SMTP_PORT: "587"

# Secret environment variables. Use value for simple installs, or point at an
# existing Kubernetes Secret if you manage secrets outside this chart.
secretEnv:
  create: false
  name: ""
  values:
    SMTP_PASSWORD: ""
    ADMIN_TOKEN: ""
  existingSecret:
    name: ""
    keys: []

# Main HTTP service for the Vaultwarden web UI/API.
service:
  type: ClusterIP
  port: 80
  targetPort: 80
  portName: http
  extraPorts: []

extraContainerPorts: []

# Persistent application data. This stores Vaultwarden's database, attachments,
# sends, and related state.
persistence:
  config:
    enabled: true
    mountPath: /data
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: ""

# Advanced volume hooks for custom mounts that are not covered above.
extraVolumes: []
extraVolumeMounts: []

# Optional Kubernetes Ingress for exposing the web UI/API.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Optional Gateway API HTTPRoute for exposing the web UI/API.
# Gateway API routing. Requires Gateway API CRDs and a compatible controller.
# Map keys (main, internal, external, etc.) are names you choose, not access policies.
# Every enabled entry creates one HTTPRoute named <app-fullname>-<key>.
httpRoutes:
  main:
    # Keep disabled until you provide Gateway references and application hostnames.
    # Additional entries default to enabled when their enabled field is omitted.
    enabled: false
    # Per-route metadata, for example controller-specific annotations.
    annotations: {}
    # Attach this route to one or more Gateways/listeners. The Gateway must allow
    # routes from this app's namespace. Omit namespace for a same-namespace Gateway;
    # omit sectionName to target compatible listeners on that Gateway.
    parentRefs: []
    #  - name: internal-gateway
    #    namespace: ingress
    #    sectionName: https
    #  - name: second-internal-gateway
    #    namespace: ingress
    #    sectionName: https
    # Requests can match ANY hostname below, on ANY compatible parent above.
    # These lists do not pair hostnames with individual Gateways by position.
    hostnames: []
    #  - app.internal.example.com
    #  - app-alias.internal.example.com
    # Match request paths/headers/methods and optionally apply Gateway API filters.
    # Rules default to PathPrefix / when omitted. Backend references are generated
    # from this chart's application Service and HTTP port, not supplied here.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # filters:
        #   - type: RequestHeaderModifier
        #     requestHeaderModifier:
        #       set:
        #         - name: X-Route
        #           value: internal
  # Use a separate entry when public hostnames should attach to another Gateway.
  # external:
  #   enabled: true
  #   annotations: {}
  #   parentRefs:
  #     - name: external-gateway
  #       namespace: ingress
  #       sectionName: https
  #   hostnames:
  #     - app.example.com
  #     - app-alias.example.com
  #   rules:
  #     - matches:
  #         - path:
  #             type: PathPrefix
  #             value: /

resources: {}

livenessProbe:
  httpGet:
    path: /alive
    port: http
  initialDelaySeconds: 45
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /alive
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
