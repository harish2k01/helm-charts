{{- if and .Values.ingress.enabled .Values.httpRoute.enabled }}
{{- fail "Enable only one of ingress.enabled or httpRoute.enabled" }}
{{- end }}
{{- if .Values.httpRoute.enabled }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs must identify a Gateway" }}
{{- end }}
{{- if not .Values.httpRoute.hostnames }}
{{- fail "httpRoute.hostnames must identify the site" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "portfolio-next.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portfolio-next.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs must identify a Gateway" .Values.httpRoute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    {{- required "httpRoute.hostnames must identify the site" .Values.httpRoute.hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "portfolio-next.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
