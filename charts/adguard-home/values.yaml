replicaCount: 1

# Container image. Pin this tag for repeatable DNS infrastructure rollouts.
image:
  repository: adguard/adguardhome
  tag: "v0.107.79"
  pullPolicy: IfNotPresent

# Set when pulling from a private registry or mirror that requires credentials.
imagePullSecrets: []

# Override generated resource names when installing multiple releases or when
# integrating with pre-existing naming conventions.
nameOverride: ""
fullnameOverride: ""

# Extra pod metadata for backup agents, reloaders, policy engines, or dashboards.
podAnnotations: {}
podLabels: {}

# Keep empty by default because low ports such as 53 and 80 often require image
# defaults or explicit capabilities chosen for your cluster.
podSecurityContext: {}
securityContext: {}

# Optional non-secret environment variables passed to AdGuard Home.
env: {}
# AdGuard Home reads its application settings from persisted AdGuardHome.yaml;
# do not invent env names such as UPSTREAM_DNS, ADMIN_PASSWORD or FILTERING_*.
# Optional documented runtime env (unset by default):
# env:
#   ADGUARD_HOME_DEFAULT_WEB_PORT: "80" # Wizard's suggested port, not an existing config override.
#   TZ: UTC # Optional process timezone; does not replace application config.
# ADGUARD_HOME_TEST_UPDATE_VERSION_URL is development-only and ignored by stable
# release builds; Docker build/Go/frontend variables do not configure runtime.
# Secret envFrom entries only help actual process/client environment consumers;
# AdGuard admin credentials belong in the app's managed config, not an env alias.

# Optional envFrom entries, for example configMapRef or secretRef blocks.
envFrom: []

# Optional command/args overrides for advanced image customization.
command: []
args: []
# Replacing args replaces the image CMD: retain -c and -w with the mounted paths.
# Optional example that preserves image directories and fixes the UI listen port:
# args:
#   - --no-check-update # Image default; updates are managed by image tags.
#   - -c
#   - /opt/adguardhome/conf/AdGuardHome.yaml
#   - -w
#   - /opt/adguardhome/work
#   - --web-addr=0.0.0.0:3000 # Default app address comes from persisted config/setup.
# Other optional runtime flags, unset by default: --verbose (extra logs),
# --logfile=/path (default stdout; mount writable path), --pidfile=/path
# (default none), --glinet (GL-Inet compatibility), --no-permcheck (avoid unless
# required by storage). --check-config/--version/--help exit and are Job/debug
# commands; --service/--update are host-service actions, not pod startup flags.
# Deprecated: --host/--port (use --web-addr), --no-mem-optimization (no effect),
# --no-etc-hosts (use clients.runtime_sources.hosts/dns.hostsfile_enabled).

# Service exposing the initial setup/admin UI and DNS ports. Use LoadBalancer,
# MetalLB annotations, or externalTrafficPolicy when clients outside the cluster
# should use this pod as their DNS resolver.
service:
  type: ClusterIP
  annotations: {}
  externalTrafficPolicy: ""
  ports:
    - name: http-setup
      port: 3000
      targetPort: http-setup
      protocol: TCP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP

# Container ports should line up with service.ports. Add ports here before
# exposing optional services like DoT, DoQ, DNSCrypt, DHCP, or post-setup HTTP.
containerPorts:
  - name: http-setup
    containerPort: 3000
    protocol: TCP
  - name: dns-tcp
    containerPort: 53
    protocol: TCP
  - name: dns-udp
    containerPort: 53
    protocol: UDP

# Persistent data and query state stored by AdGuard Home in one PVC.
# AdGuardHome.yaml is writable application state in the conf subdirectory.
# See CHANGELOG.md for filtering.max_http_size and TLS changes.
# Persisted config examples (edit via app or while the process is stopped;
# these are AdGuardHome.yaml keys, not Helm values and are not auto-applied):
# filtering:
#   max_http_size: 256 MB # New default maximum downloaded rule-list size; nonzero.
#   filters_update_interval: 24 # Default hours; supported range now 0..8760.
# http:
#   address: 0.0.0.0:3000 # Setup listener; align Service and probes if changed.
# dns:
#   port: 53 # Default DNS listener; add encrypted-DNS ports explicitly if enabled.
#   upstream_dns: [] # Site-selected upstreams, managed by the UI/config.
# tls:
#   certificate_path: /etc/adguard-tls/tls.crt # Optional mounted TLS certificate.
#   private_key_path: /etc/adguard-tls/tls.key # Secret volume, not literal key text.
# tls.strict_sni_check is deprecated upstream; review it in existing config.
# Existing DNS clients, upstreams, filters, DHCP, rewrites and auth settings stay
# application-owned so upgrades do not overwrite the active configuration.
persistence:
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 3Gi
  storageClassName: ""
  work:
    mountPath: /opt/adguardhome/work
    subPath: work
  conf:
    mountPath: /opt/adguardhome/conf
    subPath: conf

# Advanced volume hooks for custom certificates, config files, or host mounts.
extraVolumes: []
# Optional certificate Secret (unset by default):
# extraVolumes:
#   - name: adguard-tls
#     secret:
#       secretName: adguard-tls
# extraVolumeMounts:
#   - name: adguard-tls
#     mountPath: /etc/adguard-tls
#     readOnly: true
extraVolumeMounts: []

# Optional Kubernetes Ingress for the setup/admin UI. Ingress only covers HTTP;
# expose DNS with the Service.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Optional Gateway API HTTPRoute for the setup/admin UI.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# Increase resources if blocklists, query logging, or client counts are large.
resources: {}

livenessProbe:
  tcpSocket:
    port: http-setup
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: http-setup
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Use scheduling controls to place DNS on stable nodes or nodes with fixed
# external addresses.
nodeSelector: {}
tolerations: []
affinity: {}
