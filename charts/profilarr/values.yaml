# Profilarr uses SQLite and local Git repositories; run a single writer.
replicaCount: 1

# Keep the app and optional parser on compatible, pinned upstream releases.
image:
  repository: ghcr.io/dictionarry-hub/profilarr
  tag: "2.2.0"
  pullPolicy: IfNotPresent

# Use these for private registries or to align release resource names.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podLabels: {}

# The upstream image supports starting directly as UID/GID 1000. fsGroup
# grants access to a fresh PVC without a privileged ownership init container.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Keep authentication enabled. Set ORIGIN to the browser-facing HTTPS URL
# when using a reverse proxy. PORT is derived from service.targetPort.
env:
  TZ: Etc/UTC
  HOST: "0.0.0.0"
  AUTH: "on"
  UMASK: "022"
# Reference existing Secrets for optional OIDC credentials or an API key.
# Configure Arr connections and their API keys in Profilarr after installation.
envFrom: []

service:
  type: ClusterIP
  port: 6868
  targetPort: 6868
  portName: http
  extraPorts: []

# Stores SQLite state, cloned profile databases, logs, and local backups.
# Back up this volume independently. Disabling persistence uses emptyDir.
persistence:
  config:
    enabled: true
    mountPath: /config
    existingClaim: ""
    accessModes: [ReadWriteOnce]
    size: 2Gi
    storageClassName: ""

# The optional .NET parser powers custom-format tests and profile simulations.
# It shares the app pod and is not exposed through the Service or public route.
# Disable it for sync-only use, or set env.PARSER_HOST/PARSER_PORT to an external
# parser when this sidecar is disabled.
parser:
  enabled: true
  image:
    repository: ghcr.io/dictionarry-hub/profilarr-parser
    tag: "2.2.0"
    pullPolicy: IfNotPresent
  port: 5000
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  startupProbe:
    httpGet:
      path: /health
      port: parser
    periodSeconds: 5
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /health
      port: parser
    periodSeconds: 30
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: parser
    periodSeconds: 10
    timeoutSeconds: 5

# Extra mounts are available for certificates or other advanced integrations.
# Profilarr manages Arr apps through APIs and does not need your media PVC.
extraVolumes: []
extraVolumeMounts: []

# Choose Ingress or Gateway API to publish the web UI. Both are off by default.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
# Gateway API routing. Requires Gateway API CRDs and a compatible controller.
# Map keys (main, internal, external, etc.) are names you choose, not access policies.
# Every enabled entry creates one HTTPRoute named <app-fullname>-<key>.
httpRoutes:
  main:
    # Keep disabled until you provide Gateway references and application hostnames.
    # Additional entries default to enabled when their enabled field is omitted.
    enabled: false
    # Per-route metadata, for example controller-specific annotations.
    annotations: {}
    # Attach this route to one or more Gateways/listeners. The Gateway must allow
    # routes from this app's namespace. Omit namespace for a same-namespace Gateway;
    # omit sectionName to target compatible listeners on that Gateway.
    parentRefs: []
    #  - name: internal-gateway
    #    namespace: ingress
    #    sectionName: https
    #  - name: second-internal-gateway
    #    namespace: ingress
    #    sectionName: https
    # Requests can match ANY hostname below, on ANY compatible parent above.
    # These lists do not pair hostnames with individual Gateways by position.
    hostnames: []
    #  - app.internal.example.com
    #  - app-alias.internal.example.com
    # Match request paths/headers/methods and optionally apply Gateway API filters.
    # Rules default to PathPrefix / when omitted. Backend references are generated
    # from this chart's application Service and HTTP port, not supplied here.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # filters:
        #   - type: RequestHeaderModifier
        #     requestHeaderModifier:
        #       set:
        #         - name: X-Route
        #           value: internal
  # Use a separate entry when public hostnames should attach to another Gateway.
  # external:
  #   enabled: true
  #   annotations: {}
  #   parentRefs:
  #     - name: external-gateway
  #       namespace: ingress
  #       sectionName: https
  #   hostnames:
  #     - app.example.com
  #     - app-alias.example.com
  #   rules:
  #     - matches:
  #         - path:
  #             type: PathPrefix
  #             value: /

# Size requests after observing profile database size and concurrent operations.
resources: {}
# Startup and liveness check the listener; upstream health also checks profile
# databases, so repository outages should affect readiness, not restart the app.
startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  failureThreshold: 60
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5

# Use scheduling controls for storage locality or dedicated application nodes.
nodeSelector: {}
tolerations: []
affinity: {}
