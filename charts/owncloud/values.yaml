#   OWNCLOUD_MARKETPLACE_URL: ""
#   # Define multiple memcached servers as a JSON-encoded list of [host, port] or [host, port, weight] tuples, e.g. [["mem1",11211,33],["mem2",11211]]. Overrides the single-server OWNCLOUD_MEMCACHED_HOST/OWNCLOUD_MEMCACHED_PORT pair when set Wrapper default: unset.
#   OWNCLOUD_MEMCACHED_SERVERS: ""
#   # Optional target wrapper setting; see linked configuration reference. Wrapper default: unset.
#   OWNCLOUD_MOUNT_FILE: ""
#   # Path to a custom openssl.cnf file, e.g. when using a custom PKI or CA in the container Wrapper default: unset.
#   OWNCLOUD_OPENSSL_CONFIG: ""
#   # Allow JavaScript execution in PDF files. Security risk — only enable if required Wrapper default: unset.
#   OWNCLOUD_PDF_VIEWER_ENABLE_SCRIPTING: ""
#   # Suggested client polling interval in milliseconds Wrapper default: unset.
#   OWNCLOUD_POLLINTERVAL: ""
#   # Sets PHP option post_max_size, the size limit for form and multipart POST bodies that PHP parses. File uploads go through WebDAV PUT and are not affected, and the body of other POST requests is still readable. Keep it below a quarter of PHP's memory_limit, so that parsing a large request cannot reach it. That is OWNCLOUD_MEMORY_LIMIT on ownCloud 11, but on ownCloud 10 the web server always uses 512M, because ownCloud's .htaccess sets it. Wrapper default: 100M.
#   OWNCLOUD_POST_MAX_SIZE: "100M"
#   # JPEG preview display quality from 1 to 100 (-1 uses the PHP default of ~75%) Wrapper default: unset.
#   OWNCLOUD_PREVIEW_JPEG_IMAGE_DISPLAY_QUALITY: ""
#   # Comma-separated list of hostnames that bypass the proxy Wrapper default: unset.
#   OWNCLOUD_PROXY_IGNORE: ""
#   # Allow self-signed certificates on the Redis server (true/false) (see phpredis docs). Wrapper default: unset.
#   OWNCLOUD_REDIS_TLS_ALLOW_SELF_SIGNED: ""
#   # Path to CA certificate file for TLS-secured Redis connections (see phpredis docs). Wrapper default: unset.
#   OWNCLOUD_REDIS_TLS_CAFILE: ""
#   # Directory containing CA certificates for TLS-secured Redis connections (see phpredis docs). Wrapper default: unset.
#   OWNCLOUD_REDIS_TLS_CAPATH: ""
#   # OpenSSL cipher list for Redis TLS connections (see phpredis docs). Wrapper default: unset.
#   OWNCLOUD_REDIS_TLS_CIPHERS: ""
#   # Path to client certificate file for mutual TLS to Redis (see phpredis docs). Wrapper default: unset.
#   OWNCLOUD_REDIS_TLS_LOCAL_CERT: ""
#   # Path to client private key file for mutual TLS to Redis (see phpredis docs). Wrapper default: unset.
#   OWNCLOUD_REDIS_TLS_LOCAL_PK: ""
#   # Expected hostname in the Redis server certificate, overrides the connection host for SNI (see phpredis docs). Wrapper default: unset.
#   OWNCLOUD_REDIS_TLS_PEER_NAME: ""
#   # Validate the Redis server certificate against the CA (true/false) (see phpredis docs). Wrapper default: unset.
#   OWNCLOUD_REDIS_TLS_VERIFY_PEER: ""
#   # Validate that the Redis server certificate CN/SAN matches the peer name (true/false) (see phpredis docs). Wrapper default: unset.
#   OWNCLOUD_REDIS_TLS_VERIFY_PEER_NAME: ""
#   # Show a quick-action button for creating public links in the file list Wrapper default: unset.
#   OWNCLOUD_SHARING_SHOW_PUBLIC_LINK_QUICK_ACTION: ""
#   # Only validate the exact login name entered by the user, not alternative formats Wrapper default: unset.
#   OWNCLOUD_STRICT_LOGIN_ENFORCED: ""
#   # Send daily telemetry reports (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_TELEMETRY_ENABLED: ""
#   # Comma-separated list of directory names that bypass the trash bin Wrapper default: unset.
#   OWNCLOUD_TRASHBIN_SKIP_DIRECTORIES: ""
#   # Comma-separated list of file extensions that bypass the trash bin Wrapper default: unset.
#   OWNCLOUD_TRASHBIN_SKIP_EXTENSIONS: ""
#   # Files larger than this size bypass the trash bin (e.g. 1GB) Wrapper default: unset.
#   OWNCLOUD_TRASHBIN_SKIP_SIZE_THRESHOLD: ""
#   # Enable medial search in the LDAP user backend Wrapper default: unset.
#   OWNCLOUD_USER_LDAP_ENABLE_MEDIAL_SEARCH: ""
#   # Use only the short hostname (no FQDN) in status.php Wrapper default: unset.
#   OWNCLOUD_USE_RELATIVE_DOMAIN_NAME: ""
#   # Base URL for the ownCloud Web UI Wrapper default: unset.
#   OWNCLOUD_WEB_BASEURL: ""
#   # Redirect public/private links to the ownCloud Web UI Wrapper default: unset.
#   OWNCLOUD_WEB_REWRITE_LINKS: ""
#   # Probe both NFC/NFD UTF-8 forms in the Windows Network Drive collaborative cache wrapper, needed for macOS HFS+ mounts (true/false) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND2_CACHE_WRAPPER_NORMALIZE: ""
#   # TTL in seconds for the Windows Network Drive collaborative cache wrapper (default 1800); use a negative value to disable (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND2_CACHE_WRAPPER_TTL: ""
#   # Register the Windows Network Drive app with the Activity app to report what wnd:process-queue is doing (true/false) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_ACTIVITY_REGISTER_EXTENSION: ""
#   # Send activity notifications to sharees of Windows Network Drive files and folders; requires OWNCLOUD_WND_ACTIVITY_REGISTER_EXTENSION (true/false) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_ACTIVITY_SEND_TO_SHAREES: ""
#   # Timeout in milliseconds applied to all Windows Network Drive backend operations and connections (default 20000) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_CONNECTOR_OPTS_TIMEOUT: ""
#   # Comma-separated list of error codes that trigger a password reset for Windows Network Drive (default 13 = access denied); empty disables it (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_ERROR_CODES_PASSWORD_RESET: ""
#   # How Windows Network Drive evaluates file attributes: none, stat (default) or getxattr (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_FILE_INFO_PARSE_ATTRS_MODE: ""
#   # Make the Windows Network Drive group membership component assume an ACL entry is a user and check users first (true/false) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_GROUP_MEMBERSHIP_CHECK_USER_FIRST: ""
#   # Enable the in-memory notifier so Windows Network Drive storages reset passwords on detecting a wrong password (true/false, default true) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_IN_MEMORY_NOTIFIER_ENABLE: ""
#   # Listen to events from the smb_acl app to update Windows Network Drive storages when an ACL changes (true/false) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_LISTEN_EVENTS_SMB_ACL: ""
#   # Interval in seconds after which the Windows Network Drive listener reconnects to the database to avoid crashes from idle connections (default 28800) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_LISTEN_RECONNECT_AFTER_TIME: ""
#   # Enable additional debug logging for the Windows Network Drive app (true/false) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_LOGGING_ENABLE: ""
#   # Maximum number of items in the Windows Network Drive permission manager per-request cache (default 512) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WND_PERMISSION_MANAGER_CACHE_SIZE: ""
#   # Enable the Microsoft Office 365 business flow for WOPI (yes/no) (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WOPI_BUSINESS_FLOW_ENABLED: ""
#   # Restrict Microsoft Office Online access to a specific group (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WOPI_GROUP: ""
#   # URL of the Microsoft Office Online server (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WOPI_OFFICE_ONLINE_SERVER: ""
#   # Business proxy URL for Microsoft Office 365 (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WOPI_PROXY_URL: ""
#   # Retention engine for the workflow/tagging app: tagbased (default) or userbased (Enterprise only) Wrapper default: unset.
#   OWNCLOUD_WORKFLOW_RETENTION_ENGINE: ""

# Additional sensitive/structured settings: use secretEnv.existingSecret.keys or
# extraEnv.valueFrom; do not put credentials in the ordinary env map.
#   OWNCLOUD_METRICS_SHARED_SECRET: "" # Unset by default; supply through a referenced Secret.
#   OWNCLOUD_OPENID_CONNECT: "" # Unset by default; supply through a referenced Secret.
#   OWNCLOUD_REDIS_TLS_PASSPHRASE: "" # Unset by default; supply through a referenced Secret.
#   OWNCLOUD_USER_BACKENDS: "" # Unset by default; supply through a referenced Secret.
#   OWNCLOUD_WOPI_TOKEN_KEY: "" # Unset by default; supply through a referenced Secret.

# OWNCLOUD_SKELETON_DIRECTORY is not consumed by the 24.04 wrapper. It now uses
# /mnt/data/skeleton only when nonempty, otherwise the bundled core/skeleton.
# Core account_lockout.* has no wrapper environment aliases: preserve the secure
# defaults (enabled=true, max_attempts=5, duration=600, attempt_window=900).
# Tune them with occ config:system:set and --type=boolean/integer after reviewing
# the login/DoS tradeoff; occ user:unlock clears a temporary lockout early.
# source: https://github.com/owncloud-docker/base/tree/b2071642309604eaf42b64c6c96ffb9052ab0bb1/v24.04/overlay

# Additional environment sources such as ConfigMaps or Secrets managed elsewhere.
envFrom: []

# Extra environment variables with full Kubernetes EnvVar support, including
# valueFrom references.
extraEnv: []

# Secret environment variables for SMTP credentials or other sensitive ownCloud
# settings not covered by owncloud.admin or database.
secretEnv:
  create: false
  name: ""
  values: {}
  existingSecret:
    name: ""
    keys: []
    # - envName: OWNCLOUD_MAIL_SMTP_PASSWORD
    #   secretKey: smtp-password
    #   optional: false

command: []
args: []

# Additional init containers and sidecars, for example backup agents,
# certificate syncers, or log/metrics exporters.
extraInitContainers: []
sidecars: []

# Container lifecycle hooks.
lifecycle: {}

# Internal MariaDB database matching the upstream Docker Compose deployment.
# Disable this section when using an external MySQL/MariaDB service.
mariadb:
  enabled: true
  image:
    repository: mariadb
    tag: "10.11"
    pullPolicy: IfNotPresent
  service:
    port: 3306
  auth:
    # Leave empty to let MariaDB generate a random root password. If database
    # existingSecret is set and rootPassword is set, that Secret must also
    # contain rootPasswordKey.
    rootPassword: ""
    rootPasswordKey: db-root-password
  args:
    - --max-allowed-packet=128M
    - --innodb-log-file-size=64M
  persistence:
    enabled: true
    # Immutable claim labels: pin the current template labels for existing installs.
    # Keep historical version labels fixed; new installs use stable defaults.
    claimTemplateLabels: {}
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: OrderedReady
  terminationGracePeriodSeconds: 60
  extraEnv:
    - name: MARIADB_AUTO_UPGRADE
      value: "1"
  extraVolumes: []
  extraVolumeMounts: []
  livenessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - MYSQL_PWD="$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u "$MYSQL_USER"
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - MYSQL_PWD="$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u "$MYSQL_USER"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Redis integration used by the official ownCloud Docker stack. Set internal to
# false and provide host when reusing an existing Redis instance.
redis:
  enabled: true
  internal: true
  # External Redis skips the unauthenticated internal init probe; the wrapper
  # performs its bounded startup wait. For TLS use tls://host and configure
  # OWNCLOUD_REDIS_TLS_* plus a Secret password through the hooks above.
  host: ""
  image:
    repository: redis
    tag: "8.10.2"
    pullPolicy: IfNotPresent
  service:
    # Passed to the ownCloud client and Redis Service/container metadata.
    # For a custom internal listener, also set --port in args and update probes.
    port: 6379
  args:
    - --databases
    - "1"
  persistence:
    enabled: true
    # Immutable claim labels: pin the current template labels for existing installs.
    # Keep historical version labels fixed; new installs use stable defaults.
    claimTemplateLabels: {}
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClassName: ""
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: OrderedReady
  terminationGracePeriodSeconds: 30
  # Official Redis 8 entrypoint settings, for example SKIP_FIX_PERMS=1 when
  # volume ownership is managed externally. EnvVar supports Secret references.
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # Allow up to ten minutes to load an existing RDB/AOF before liveness starts.
  # Set to {} to disable; increase for larger datasets after measuring startup.
  startupProbe:
    exec:
      command:
        - redis-cli
        - ping
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  livenessProbe:
    exec:
      command:
        - redis-cli
        - ping
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    exec:
      command:
        - redis-cli
        - ping
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Main HTTP service for the ownCloud web UI and WebDAV endpoint.
service:
  type: ClusterIP
  annotations: {}
  port: 8080
  targetPort: http
  portName: http
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: ""
  extraPorts: []

containerPorts:
  - name: http
    containerPort: 8080
    protocol: TCP

# Persistent ownCloud data. This stores config, apps, files, and state managed
# by the official image under /mnt/data.
persistence:
  data:
    enabled: true
    mountPath: /mnt/data
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    storageClassName: ""

# Advanced volume hooks for custom CA bundles, config overlays, or backups.
extraVolumes: []
extraVolumeMounts: []

# Optional Kubernetes Ingress for exposing ownCloud through an ingress controller.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Optional Gateway API HTTPRoute for exposing ownCloud through a Gateway.
# Gateway API routing. Requires Gateway API CRDs and a compatible controller.
# Map keys (main, internal, external, etc.) are names you choose, not access policies.
# Every enabled entry creates one HTTPRoute named <app-fullname>-<key>.
httpRoutes:
  main:
    # Keep disabled until you provide Gateway references and application hostnames.
    # Additional entries default to enabled when their enabled field is omitted.
    enabled: false
    # Per-route metadata, for example controller-specific annotations.
    annotations: {}
    # Attach this route to one or more Gateways/listeners. The Gateway must allow
    # routes from this app's namespace. Omit namespace for a same-namespace Gateway;
    # omit sectionName to target compatible listeners on that Gateway.
    parentRefs: []
    #  - name: internal-gateway
    #    namespace: ingress
    #    sectionName: https
    #  - name: second-internal-gateway
    #    namespace: ingress
    #    sectionName: https
    # Requests can match ANY hostname below, on ANY compatible parent above.
    # These lists do not pair hostnames with individual Gateways by position.
    hostnames: []
    #  - app.internal.example.com
    #  - app-alias.internal.example.com
    # Match request paths/headers/methods and optionally apply Gateway API filters.
    # Rules default to PathPrefix / when omitted. Backend references are generated
    # from this chart's application Service and HTTP port, not supplied here.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # filters:
        #   - type: RequestHeaderModifier
        #     requestHeaderModifier:
        #       set:
        #         - name: X-Route
        #           value: internal
  # Use a separate entry when public hostnames should attach to another Gateway.
  # external:
  #   enabled: true
  #   annotations: {}
  #   parentRefs:
  #     - name: external-gateway
  #       namespace: ingress
  #       sectionName: https
  #   hostnames:
  #     - app.example.com
  #     - app-alias.example.com
  #   rules:
  #     - matches:
  #         - path:
  #             type: PathPrefix
  #             value: /

resources: {}

# Optional PodDisruptionBudget. Enable this when your cluster performs voluntary
# disruptions and your storage/database setup can tolerate the selected policy.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# Optional NetworkPolicy. When enabled, ingress is limited to the ownCloud
# service port and egress is limited to DNS plus chart-managed MariaDB/Redis
# unless extraIngress/extraEgress rules are provided.
networkPolicy:
  enabled: false
  ingressFrom: []
  extraIngress: []
  allowDNS: true
  extraEgress: []

startupProbe:
  exec:
    command:
      - /usr/bin/healthcheck
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 60

livenessProbe:
  exec:
    command:
      - /usr/bin/healthcheck
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  exec:
    command:
      - /usr/bin/healthcheck
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 5

nodeSelector: {}
tolerations: []
affinity: {}
