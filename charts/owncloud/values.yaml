#   # Group login policy rules as a JSON-encoded map keyed by login type (e.g. password, token), each holding allowOnly/reject lists of group names, e.g. {"password":{"reject":["admin"]}}. Requires the group login policy in OWNCLOUD_LOGIN_POLICY_ORDER Wrapper default: unset.
#   OWNCLOUD_LOGIN_POLICY_GROUP_FORBID_MAP: ""
#   # Ordered list of login policy class names. Comma-separated Wrapper default: unset.
#   OWNCLOUD_LOGIN_POLICY_ORDER: ""
#   # Strip the display name from the From header in sharing notification emails Wrapper default: unset.
#   OWNCLOUD_MAIL_REMOVE_SENDER_DISPLAY_NAME: ""
