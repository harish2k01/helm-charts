replicaCount: 1

image:
  repository: deluan/navidrome
  tag: "0.64.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Non-secret Navidrome settings. Add any other ND_* settings here.
# Optional new settings can be supplied via this map without template changes:
# ND_JELLYFIN_ENABLED, ND_JELLYFIN_SERVERNAME, ND_JELLYFIN_EXPOSEDPUBLICUSERS,
# ND_JELLYFIN_MAXCONCURRENTSTREAMS, ND_JELLYFIN_AUTODISCOVERY, ND_JELLYFIN_QUICKCONNECT,
# ND_SCANNER_ARTISTSPLITEXCEPTIONS, ND_SCANNER_IGNOREDOTFOLDERS,
# ND_TRANSCODING_MAXCONCURRENT, ND_TRANSCODING_MAXCONCURRENTPERUSER.
env:
  TZ: Asia/Kolkata
  # Scanner settings use the section separator underscore.
  ND_SCANNER_SCHEDULE: 1h
  # Preserve the pre-0.63 default; sharing is now enabled by default upstream.
  ND_ENABLESHARING: "false"

# Main HTTP service for the Navidrome web UI.
service:
  type: ClusterIP
  port: 4533
  targetPort: 4533
  portName: http
  extraPorts: []

# Additional container ports for custom deployments.
extraContainerPorts: []

# Persistent Navidrome application data. This stores the database, settings,
# cache, and other writable app state, not the music library.
persistence:
  config:
    enabled: true
    mountPath: /data
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: ""
  music:
    enabled: true
    mountPath: /music
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 100Gi
    storageClassName: ""
    readOnly: true

# Optional host device mounts for advanced use cases.
hostDevices:
  enabled: false
  devices: []

# Advanced volume hooks for custom mounts that are not covered above.
extraVolumes: []
extraVolumeMounts: []

# Optional Kubernetes Ingress for exposing the web UI.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Optional Gateway API HTTPRoute for exposing the web UI.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

# Allow database migrations/scans to finish before liveness starts restarting pods.
# Increase failureThreshold for large libraries or slow persistent storage.
startupProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 90

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 45
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
