replicaCount: 1

# Container image. The default tag is pinned instead of using latest so chart
# installs are repeatable.
image:
  repository: lscr.io/linuxserver/jellyfin
  tag: "10.11.11"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# LinuxServer.io images use PUID/PGID to choose the user that owns app files.
# Match these to the permissions on your config and media volumes.
env:
  PUID: "3000"
  PGID: "3000"
  TZ: Asia/Kolkata

# Main HTTP service for the Jellyfin web UI.
# Existing Secret/ConfigMap sources; explicit env entries take precedence.

  # Optional runtime configuration. Every item below is commented and has no chart
  # default. Leave unset to retain the app/config-file setting. Values are strings.
  # Full purpose, upstream defaults, precedence and sources: CONFIGURATION.md.
  # Mask applied to newly created files Upstream default: 022.
  # UMASK: "022"
  # URL advertised by discovery; include scheme Upstream default: unset.
  # JELLYFIN_PublishedServerUrl: "https://jellyfin.example.com"
  # LinuxServer wrapper binary override; custom path must exist Upstream default: /usr/lib/jellyfin-ffmpeg/ffmpeg.
  # FFMPEG_PATH: "/usr/lib/jellyfin-ffmpeg/ffmpeg"
  # Default web redirect path Upstream default: web/.
  # JELLYFIN_DefaultRedirectPath: "web/"
  # Serve bundled web client Upstream default: True.
  # JELLYFIN_hostwebclient: "true"
  # FFmpeg probing byte budget Upstream default: 1G.
  # JELLYFIN_FFmpeg__probesize: "1G"
  # FFmpeg analyze duration budget Upstream default: 200M.
  # JELLYFIN_FFmpeg__analyzeduration: "200M"
  # Skip ffmpeg validation; normally leave false Upstream default: False.
  # JELLYFIN_FFmpeg__novalidation: "false"
  # Image extraction performance tradeoff Upstream default: False.
  # JELLYFIN_FFmpeg__imgExtractPerfTradeoff: "false"
  # Use Unix socket; requires deliberate Service/probe redesign Upstream default: False.
  # JELLYFIN_kestrel__socket: "false"
  # Unix listener socket path Upstream default: unset.
  # JELLYFIN_kestrel__socketPath: "/config/jellyfin.sock"
  # Unix socket permission mode Upstream default: unset.
  # JELLYFIN_kestrel__socketPermissions: "660"
  # SQLite cache size in pages Upstream default: 20000.
  # JELLYFIN_sqlite__cacheSize: "20000"
  # React to network interface changes Upstream default: True.
  # JELLYFIN_DetectNetworkChange: "true"

  # Optional LinuxServer image extensions; use trusted mods only (executes code).
  # DOCKER_MODS: ""

envFrom: []

service:
  type: ClusterIP
  port: 8096
  targetPort: 8096
  portName: http
  extraPorts: []

extraContainerPorts: []

# Persistent application configuration. This should be separate from media
# storage because Jellyfin writes databases, metadata, and user settings here.
persistence:
  config:
    enabled: true
    mountPath: /config
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    storageClassName: ""

# Optional existing media PVC. For Jellyfin, this is commonly mounted read-only.
# Use media.mounts with subPath entries to expose selected library folders from
# a larger shared PVC, such as Movies, Shows, or Music.
media:
  enabled: false
  existingClaim: ""
  mountPath: /vault
  readOnly: true
  mounts: []

# Optional host device mounts, for example /dev/dri for hardware acceleration.
# Pods using host devices should be scheduled only on nodes that expose them.
hostDevices:
  enabled: false
  devices: []

# Advanced volume hooks for custom mounts that are not covered above.
extraVolumes: []
extraVolumeMounts: []

# Optional Kubernetes Ingress for exposing the web UI.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Optional Gateway API HTTPRoute for exposing the web UI.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

# Default HTTP health checks. Adjust delays if your media library scan makes
# startup slower than usual.
# Allow database migrations/scans to finish before liveness starts restarting pods.
# Increase failureThreshold for large libraries or slow persistent storage.
startupProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 90

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Additional named HTTPRoutes, each with its own Gateway and hostname list.
# Entries are enabled unless enabled: false; the legacy httpRoute is independent.
# See README.md for an internal/external example.
httpRoutes: {}
