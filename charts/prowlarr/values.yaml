replicaCount: 1

# Container image. The default tag is pinned instead of using latest so chart
# installs are repeatable.
image:
  repository: lscr.io/linuxserver/prowlarr
  tag: "2.6.5"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# LinuxServer.io images use PUID/PGID to choose the user that owns app files.
# Match these to the permissions on your config volume.
# New server settings are opt-in: list your external/service DNS names and only
# the ingress proxy CIDRs you control. Do not trust every address.
# PROWLARR__SERVER__ALLOWEDHOSTS: "prowlarr.example.com,prowlarr,prowlarr.default.svc.cluster.local"
# PROWLARR__SERVER__TRUSTEDNETWORKS: "192.0.2.0/24"
env:
  PUID: "3000"
  PGID: "3000"
  TZ: Asia/Kolkata

# Load credentials from existing Secrets or shared ConfigMaps. Explicit env wins.

  # Optional runtime configuration. Every item below is commented and has no chart
  # default. Leave unset to retain the app/config-file setting. Values are strings.
  # Full purpose, upstream defaults, precedence and sources: CONFIGURATION.md.
  # Mask applied to newly created files Upstream default: 022.
  # UMASK: "022"
  # App identity and UI: InstanceName Upstream default: Prowlarr.
  # PROWLARR__APP__INSTANCENAME: "Prowlarr"
  # App identity and UI: Theme Upstream default: auto.
  # PROWLARR__APP__THEME: "auto"
  # App identity and UI: LaunchBrowser Upstream default: true.
  # PROWLARR__APP__LAUNCHBROWSER: "true"
  # Authentication: ApiKey Upstream default: generated/persisted.
  # Secret value: supply using envFrom or a mounted Secret, not plaintext values.
  # PROWLARR__AUTH__APIKEY: ""
  # Authentication: Enabled Upstream default: false.
  # PROWLARR__AUTH__ENABLED: "false"
  # Authentication: Method Upstream default: None (first-run setup required).
  # PROWLARR__AUTH__METHOD: "Forms"
  # Authentication: Required Upstream default: Enabled.
  # PROWLARR__AUTH__REQUIRED: "Enabled"
  # Authentication: TrustCgnatIpAddresses Upstream default: false.
  # PROWLARR__AUTH__TRUSTCGNATIPADDRESSES: "false"
  # Logging: Level Upstream default: debug.
  # PROWLARR__LOG__LEVEL: "debug"
  # Logging: FilterSentryEvents Upstream default: true.
  # PROWLARR__LOG__FILTERSENTRYEVENTS: "true"
  # Logging: Rotate Upstream default: 50.
  # PROWLARR__LOG__ROTATE: "50"
  # Logging: SizeLimit Upstream default: 1.
  # PROWLARR__LOG__SIZELIMIT: "1"
  # Logging: Sql Upstream default: false.
  # PROWLARR__LOG__SQL: "false"
  # Logging: ConsoleLevel Upstream default: empty.
  # PROWLARR__LOG__CONSOLELEVEL: ""
  # Logging: ConsoleFormat Upstream default: Standard.
  # PROWLARR__LOG__CONSOLEFORMAT: "Standard"
  # Logging: AnalyticsEnabled Upstream default: true.
  # PROWLARR__LOG__ANALYTICSENABLED: "true"
  # Logging: SyslogServer Upstream default: empty.
  # PROWLARR__LOG__SYSLOGSERVER: ""
  # Logging: SyslogPort Upstream default: 514.
  # PROWLARR__LOG__SYSLOGPORT: "514"
  # Logging: SyslogLevel Upstream default: inherits Log.Level.
  # PROWLARR__LOG__SYSLOGLEVEL: ""
  # Logging: DbEnabled Upstream default: true.
  # PROWLARR__LOG__DBENABLED: "true"
  # External PostgreSQL: Host Upstream default: empty (SQLite).
  # PROWLARR__POSTGRES__HOST: "postgresql.database.svc"
  # External PostgreSQL: Port Upstream default: 5432.
  # PROWLARR__POSTGRES__PORT: "5432"
  # External PostgreSQL: User Upstream default: empty.
  # PROWLARR__POSTGRES__USER: ""
  # External PostgreSQL: Password Upstream default: empty.
  # Secret value: supply using envFrom or a mounted Secret, not plaintext values.
  # PROWLARR__POSTGRES__PASSWORD: ""
  # External PostgreSQL: MainDb Upstream default: prowlarr-main.
  # PROWLARR__POSTGRES__MAINDB: "prowlarr-main"
  # External PostgreSQL: LogDb Upstream default: prowlarr-log.
  # PROWLARR__POSTGRES__LOGDB: "prowlarr-log"
  # External PostgreSQL: MainDbConnectionString Upstream default: empty.
  # Secret value: supply using envFrom or a mounted Secret, not plaintext values.
  # PROWLARR__POSTGRES__MAINDBCONNECTIONSTRING: ""
  # External PostgreSQL: LogDbConnectionString Upstream default: empty.
  # Secret value: supply using envFrom or a mounted Secret, not plaintext values.
  # PROWLARR__POSTGRES__LOGDBCONNECTIONSTRING: ""
  # Listener/proxy/TLS: UrlBase Upstream default: empty.
  # PROWLARR__SERVER__URLBASE: ""
  # Listener/proxy/TLS: BindAddress Upstream default: *.
  # PROWLARR__SERVER__BINDADDRESS: "*"
  # Listener/proxy/TLS: AllowedHosts Upstream default: empty (any host).
  # PROWLARR__SERVER__ALLOWEDHOSTS: "prowlarr.example.com"
  # Listener/proxy/TLS: Port Upstream default: 9696.
  # PROWLARR__SERVER__PORT: "9696"
  # Listener/proxy/TLS: EnableSsl Upstream default: false.
  # PROWLARR__SERVER__ENABLESSL: "false"
  # Listener/proxy/TLS: SslPort Upstream default: 6969.
  # PROWLARR__SERVER__SSLPORT: "6969"
  # Listener/proxy/TLS: SslCertPath Upstream default: empty.
  # PROWLARR__SERVER__SSLCERTPATH: ""
  # Listener/proxy/TLS: SslCertPassword Upstream default: empty.
  # Secret value: supply using envFrom or a mounted Secret, not plaintext values.
  # PROWLARR__SERVER__SSLCERTPASSWORD: ""
  # Listener/proxy/TLS: TrustedNetworks Upstream default: empty (loopback only).
  # PROWLARR__SERVER__TRUSTEDNETWORKS: "192.0.2.0/24"
  # Binary updater (keep image-managed): Mechanism Upstream default: BuiltIn.
  # PROWLARR__UPDATE__MECHANISM: "BuiltIn"
  # Binary updater (keep image-managed): Automatically Upstream default: false on Linux.
  # PROWLARR__UPDATE__AUTOMATICALLY: "false"
  # Binary updater (keep image-managed): ScriptPath Upstream default: empty.
  # PROWLARR__UPDATE__SCRIPTPATH: ""
  # Binary updater (keep image-managed): Branch Upstream default: master.
  # PROWLARR__UPDATE__BRANCH: "master"

  # Optional LinuxServer image extensions; use trusted mods only (executes code).
  # DOCKER_MODS: ""

envFrom: []

# Main HTTP service for the Prowlarr web UI/API.
service:
  type: ClusterIP
  port: 9696
  targetPort: 9696
  portName: http
  extraPorts: []

extraContainerPorts: []

# Persistent application configuration. This stores Prowlarr's database and
# settings; indexer/downloaded media does not live here.
persistence:
  config:
    enabled: true
    mountPath: /config
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: ""

# Generic media mount support. Prowlarr normally does not need media storage,
# so this is disabled by default.
media:
  enabled: false
  existingClaim: ""
  mountPath: /vault
  readOnly: false
  mounts: []

# Prowlarr usually does not need host devices, but the generic chart supports
# them for advanced use cases.
hostDevices:
  enabled: false
  devices: []

# Advanced volume hooks for custom mounts that are not covered above.
extraVolumes: []
extraVolumeMounts: []

# Optional Kubernetes Ingress for exposing the web UI/API.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Optional Gateway API HTTPRoute for exposing the web UI/API.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
    # Upstream always permits loopback hostnames, even with AllowedHosts set.
    httpHeaders:
      - name: Host
        value: localhost
  initialDelaySeconds: 45
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
    # Upstream always permits loopback hostnames, even with AllowedHosts set.
    httpHeaders:
      - name: Host
        value: localhost
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
