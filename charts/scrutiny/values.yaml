image:
  repository: ghcr.io/analogj/scrutiny
  tag: v0.9.2-web
  pullPolicy: IfNotPresent

influxdb:
  image:
    repository: influxdb
    tag: "2.9.1"
    pullPolicy: IfNotPresent
  resources: {}
  # Additional INFLUXD_* settings, including storage compaction tuning.
  # InfluxDB 2.9 hashes tokens by default. See README before opting out.
  env: {}
  # Use Secrets/ConfigMaps for bootstrap credentials or shared settings.
  envFrom: []
  # Extra influxd flags. Leave empty to retain upstream defaults.
  args: []

# Stop both writers before mounting their database volumes in a new pod.
deploymentStrategy:
  type: Recreate

initContainer:
  image:
    repository: busybox
    tag: "1.38"
    pullPolicy: IfNotPresent

service:
  port: 8080

scrutiny:
  web:
    basepath: ""
    database:
      location: /opt/scrutiny/config/scrutiny.db
    influxdb:
      scheme: http
      host: 127.0.0.1
      port: 8086
      retentionPolicy: true
  log:
    file: ""
    level: INFO
  notify:
    urls: []

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  storageClassName: ""
  scrutiny:
    size: 1Gi
  influxdb:
    size: 10Gi

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: scrutiny.local

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: traefik
      namespace: kube-system
  hostnames:
    - scrutiny.local

resources: {}

probes:
  enabled: true
